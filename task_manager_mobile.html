<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Task Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;font-size:14px;min-height:100vh}

/* =================== DESKTOP =================== */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;border:none;overflow:hidden;background:#fff;max-width:1100px;margin:0 auto;box-shadow:0 2px 24px rgba(0,0,0,0.1)}
@media(min-width:768px){body{padding:20px}.app{height:calc(100vh - 40px);border:1px solid rgba(0,0,0,0.12);border-radius:12px}}

/* =================== SIDEBAR =================== */
.sidebar{background:#f5f4f0;border-right:1px solid rgba(0,0,0,0.1);display:flex;flex-direction:column;transition:transform .25s ease;z-index:100}
.sidebar-header{padding:16px;border-bottom:1px solid rgba(0,0,0,0.1);flex-shrink:0}
.sidebar-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sidebar-title-row h2{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px}
.sidebar-close-btn{display:none;background:transparent;border:none;cursor:pointer;font-size:20px;color:#666;padding:2px}
.add-task-btn{width:100%;padding:10px 12px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;justify-content:center}
.add-task-btn:active{background:#3C3489}
.file-btns{display:flex;gap:6px;margin-top:8px}
.file-btn{flex:1;padding:8px 8px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;color:#444}
.file-btn:active{background:#EEEDFE}
.file-btn.save-btn{background:#E1F5EE;border-color:#5DCAA5;color:#0F6E56;font-weight:500}
.file-btn.save-btn:active{background:#9FE1CB}
.file-status{font-size:10px;color:#888;margin-top:6px;text-align:center;min-height:14px}
.file-status.linked{color:#0F6E56}
.filter-tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid rgba(0,0,0,0.1);flex-shrink:0}
.filter-tab{flex:1;padding:6px 4px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;background:transparent;font-size:11px;cursor:pointer;text-align:center;color:#666;font-family:inherit}
.filter-tab.active{background:#534AB7;color:#EEEDFE;border-color:#534AB7}
.task-list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.task-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.task-item:active{background:#fff;border-color:rgba(0,0,0,0.1)}
.task-item.active{background:#fff;border-color:#7F77DD}
.task-item-name{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:#888}
.urgency-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.urgency-critical{background:#E24B4A}.urgency-high{background:#EF9F27}.urgency-medium{background:#7F77DD}.urgency-low{background:#1D9E75}
.progress-mini{flex:1;height:3px;background:rgba(0,0,0,0.1);border-radius:2px;overflow:hidden}
.progress-mini-fill{height:100%;background:#7F77DD;border-radius:2px}

/* =================== MAIN =================== */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-header{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.1);display:flex;align-items:center;gap:10px;flex-shrink:0}
.hamburger{display:none;background:transparent;border:none;cursor:pointer;font-size:22px;color:#444;padding:2px;flex-shrink:0}
.view-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.view-tabs::-webkit-scrollbar{display:none}
.view-tab{padding:6px 10px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;background:transparent;font-size:12px;cursor:pointer;color:#666;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.view-tab.active{background:#534AB7;color:#EEEDFE;border-color:#534AB7}
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* =================== DETAIL =================== */
.task-detail{display:grid;grid-template-columns:1fr 260px;gap:16px}
@media(max-width:900px){.task-detail{grid-template-columns:1fr}}
.detail-card{background:#f5f4f0;border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:14px;margin-bottom:14px}
.detail-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:500;color:#666}
.task-title-input{width:100%;font-size:18px;font-weight:500;border:none;background:transparent;color:#1a1a18;font-family:inherit;outline:none;margin-bottom:8px}
.task-desc-input{width:100%;font-size:13px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;background:#fff;color:#1a1a18;font-family:inherit;padding:8px 10px;resize:vertical;outline:none;min-height:70px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta-label{font-size:11px;color:#888;margin-bottom:4px}
.deadline-input,.priority-select{font-size:13px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;background:#fff;color:#1a1a18;font-family:inherit;padding:7px 8px;outline:none;width:100%}
.countdown{font-size:16px;font-weight:500;padding:10px 14px;border-radius:8px;text-align:center;margin-top:8px}
.countdown.critical{background:#FCEBEB;color:#A32D2D}.countdown.warning{background:#FAEEDA;color:#854F0B}.countdown.ok{background:#E1F5EE;color:#0F6E56}.countdown.done{background:#EAF3DE;color:#3B6D11}
.progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.progress-bar{height:8px;background:rgba(0,0,0,0.1);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:#534AB7;border-radius:4px;transition:width .4s}
.subtask-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.subtask-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.1);background:#fff}
.subtask-row.done-item .subtask-label{text-decoration:line-through;color:#aaa}
.subtask-cb{width:18px;height:18px;cursor:pointer;accent-color:#534AB7;flex-shrink:0}
.subtask-label{flex:1;font-size:13px;outline:none;border:none;background:transparent;color:#1a1a18;font-family:inherit;min-width:0}
.subtask-del{background:transparent;border:none;cursor:pointer;color:#ccc;padding:4px;border-radius:4px;display:flex;align-items:center;font-size:16px;flex-shrink:0}
.subtask-del:active{color:#E24B4A}
.add-subtask-row{display:flex;gap:6px;margin-top:8px}
.add-subtask-input{flex:1;font-size:13px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;background:#fff;color:#1a1a18;font-family:inherit;padding:8px 10px;outline:none;min-width:0}
.add-subtask-btn{padding:8px 12px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;flex-shrink:0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-header{font-size:10px;color:#888;text-align:center;padding:4px 0}
.cal-day{font-size:11px;text-align:center;padding:5px 2px;border-radius:6px}
.cal-day.today{background:#EEEDFE;color:#534AB7;font-weight:500}
.cal-day.deadline-day{background:#FCEBEB;color:#A32D2D;font-weight:500}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-nav-btn{background:transparent;border:none;cursor:pointer;color:#666;padding:4px 10px;border-radius:4px;font-size:20px}
.cal-title{font-size:13px;font-weight:500}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:#f5f4f0;border-radius:8px;padding:10px 12px;text-align:center;border:1px solid rgba(0,0,0,0.08)}
.stat-num{font-size:22px;font-weight:500}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-critical{background:#FCEBEB;color:#A32D2D}.badge-high{background:#FAEEDA;color:#854F0B}.badge-medium{background:#EEEDFE;color:#3C3489}.badge-low{background:#E1F5EE;color:#0F6E56}.badge-done{background:#EAF3DE;color:#3B6D11}
.delete-task-btn{padding:6px 12px;background:transparent;border:1px solid #F09595;border-radius:8px;color:#A32D2D;font-size:12px;cursor:pointer;font-family:inherit}
.delete-task-btn:active{background:#FCEBEB}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.success{background:#E1F5EE;color:#0F6E56;border:1px solid #5DCAA5}
.toast.info{background:#EEEDFE;color:#3C3489;border:1px solid #7F77DD}
.toast.error{background:#FCEBEB;color:#A32D2D;border:1px solid #F09595}

/* =================== MOBILE =================== */
@media(max-width:767px){
  body{padding:0}
  .app{grid-template-columns:1fr;max-width:100%;box-shadow:none;border-radius:0;height:100vh}
  .sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,0.15)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-close-btn{display:block}
  .hamburger{display:flex}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:50}
  .overlay.show{display:block}
  .content{padding:12px}
  .main-header{padding:10px 14px}
  .task-detail{grid-template-columns:1fr}
  /* ซ่อน sidebar column 2 (ปฏิทินเล็ก+งานทั้งหมด) บนมือถือ เพราะแสดงแค่ column เดียว */
  .detail-right{display:none}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <h2><i class="ti ti-checklist"></i>Task Manager</h2>
        <button class="sidebar-close-btn" onclick="closeSidebar()"><i class="ti ti-x"></i></button>
      </div>
      <button class="add-task-btn" onclick="addTask()"><i class="ti ti-plus"></i> เพิ่มงานใหม่</button>
      <div class="file-btns">
        <button class="file-btn save-btn" onclick="saveFile()"><i class="ti ti-device-floppy"></i> บันทึก</button>
        <button class="file-btn" onclick="document.getElementById('load-input').click()"><i class="ti ti-folder-open"></i> เปิดไฟล์</button>
        <input type="file" id="load-input" accept=".json" style="display:none" onchange="loadFromFile(this)">
      </div>
      <div class="file-status" id="file-status">ยังไม่ได้เชื่อมกับไฟล์</div>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all',this)">ทั้งหมด</button>
      <button class="filter-tab" onclick="setFilter('active',this)">ดำเนินการ</button>
      <button class="filter-tab" onclick="setFilter('done',this)">เสร็จแล้ว</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <div class="main">
    <div class="main-header">
      <button class="hamburger" onclick="openSidebar()"><i class="ti ti-menu-2"></i></button>
      <div class="view-tabs">
        <button class="view-tab active" onclick="setView('detail',this)"><i class="ti ti-layout-list"></i> งาน</button>
        <button class="view-tab" onclick="setView('calendar',this)"><i class="ti ti-calendar"></i> ปฏิทิน</button>
        <button class="view-tab" onclick="setView('overview',this)"><i class="ti ti-chart-bar"></i> ภาพรวม</button>
      </div>
    </div>
    <div class="content" id="main-content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PRIORITY={critical:'วิกฤต',high:'สูง',medium:'ปานกลาง',low:'ต่ำ'};
const isMobile=()=>window.innerWidth<768;

let tasks=[];
let selectedId=null,currentFilter='all',currentView='detail';
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();
let nextId=1,nextSubId=1;
let fileHandle=null;

/* ---- sidebar mobile ---- */
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/* ---- toast ---- */
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2800);
}

/* ---- file ---- */
function updateFileStatus(){
  const el=document.getElementById('file-status');
  if(fileHandle){el.className='file-status linked';el.innerHTML='<i class="ti ti-link"></i> '+fileHandle.name;}
  else{el.className='file-status';el.textContent='ยังไม่ได้เชื่อมกับไฟล์';}
}

async function saveFile(){
  const data=JSON.stringify({tasks,meta:{savedAt:new Date().toISOString(),version:1}},null,2);
  // Desktop Chrome: ใช้ File System Access API
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle){
        fileHandle=await window.showSaveFilePicker({
          suggestedName:'tasks_data.json',
          types:[{description:'JSON File',accept:{'application/json':['.json']}}]
        });
      }
      const writable=await fileHandle.createWritable();
      await writable.write(data);await writable.close();
      updateFileStatus();
      showToast('💾 บันทึกลง '+fileHandle.name+' แล้ว','success');
    }catch(err){if(err.name!=='AbortError')showToast('บันทึกไม่ได้: '+err.message,'error');}
    return;
  }
  // Mobile / fallback: download
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='tasks_data.json';a.click();
  URL.revokeObjectURL(a.href);
  showToast('💾 ดาวน์โหลด tasks_data.json แล้ว','success');
}

function loadFromFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.tasks&&Array.isArray(data.tasks)){
        tasks=data.tasks;fileHandle=null;
        selectedId=tasks.length?tasks[0].id:null;
        recalcNextIds();updateFileStatus();render();
        showToast('📂 โหลดสำเร็จ — '+tasks.length+' งาน','info');
      }else{showToast('ไฟล์ไม่ถูกต้อง','error');}
    }catch(err){showToast('อ่านไฟล์ไม่ได้','error');}
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

/* ---- helpers ---- */
function getProgress(t){if(!t.subtasks.length)return 0;return Math.round(t.subtasks.filter(s=>s.done).length/t.subtasks.length*100)}
function getUrgency(t){
  const diff=(new Date(t.deadline)-new Date())/3600000;
  if(getProgress(t)===100)return'done';
  if(diff<24)return'critical';if(diff<72)return'high';if(diff<168)return'medium';return'low';
}
function getCountdown(deadline){
  const diff=new Date(deadline)-new Date();
  if(diff<0)return{text:'⚠ เกิน deadline แล้ว!',cls:'critical'};
  const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000);
  return{text:d>0?'เหลือ '+d+' วัน '+h+' ชม.':'เหลือ '+h+' ชม. '+m+' นาที',cls:diff<86400000?'critical':diff<259200000?'warning':'ok'};
}
function sortedTasks(){return[...tasks].sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))}
function filteredTasks(){
  return sortedTasks().filter(t=>{
    if(currentFilter==='active')return getProgress(t)<100;
    if(currentFilter==='done')return getProgress(t)===100;
    return true;
  });
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function recalcNextIds(){
  if(tasks.length){
    nextId=Math.max(...tasks.map(t=>t.id))+1;
    const all=tasks.flatMap(t=>t.subtasks.map(s=>s.id));
    nextSubId=all.length?Math.max(...all)+1:1;
  }else{nextId=1;nextSubId=1;}
}

/* ---- sidebar render ---- */
function renderSidebar(){
  const list=document.getElementById('task-list');
  const ft=filteredTasks();
  if(!ft.length){list.innerHTML='<div style="padding:20px;text-align:center;color:#888;font-size:12px">ไม่มีงาน</div>';return;}
  list.innerHTML=ft.map(t=>{
    const p=getProgress(t),u=getUrgency(t);
    const dotCls=u==='done'?'urgency-low':'urgency-'+u;
    const dl=new Date(t.deadline);
    const dlStr=dl.getDate()+'/'+(dl.getMonth()+1)+' '+dl.getHours().toString().padStart(2,'0')+':'+dl.getMinutes().toString().padStart(2,'0');
    return'<div class="task-item'+(t.id===selectedId?' active':'')+'" onclick="selectTask('+t.id+')">'
      +'<div class="task-item-name">'+escHtml(t.name)+'</div>'
      +'<div class="task-item-meta"><span class="urgency-dot '+dotCls+'"></span><span>'+dlStr+'</span>'
      +'<div class="progress-mini"><div class="progress-mini-fill" style="width:'+p+'%"></div></div><span>'+p+'%</span></div></div>';
  }).join('');
}

/* ---- main content ---- */
function renderContent(){
  if(currentView==='detail')renderDetail();
  else if(currentView==='calendar')renderCalendar();
  else renderOverview();
}

function renderDetail(){
  const mc=document.getElementById('main-content');
  const t=tasks.find(x=>x.id===selectedId);
  if(!t){
    mc.innerHTML='<div style="color:#888;text-align:center;padding:60px 20px">'
      +'<i class="ti ti-clipboard-list" style="font-size:48px;display:block;margin-bottom:16px;color:#ccc"></i>'
      +'<div style="font-size:16px;font-weight:500;color:#555;margin-bottom:8px">ยังไม่มีงาน</div>'
      +'<div style="font-size:13px;margin-bottom:20px">กด + เพิ่มงานใหม่ หรือเปิดไฟล์ที่บันทึกไว้</div>'
      +'<button onclick="addTask()" style="padding:10px 24px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit"><i class="ti ti-plus"></i> เพิ่มงานแรก</button></div>';
    return;
  }
  const p=getProgress(t),u=getUrgency(t);
  const cd=u==='done'?{text:'งานเสร็จสมบูรณ์ 🎉',cls:'done'}:getCountdown(t.deadline);
  const bc='badge-'+(u==='done'?'done':u);
  mc.innerHTML='<div class="task-detail">'
  // === LEFT COLUMN ===
  +'<div>'
  +'<div class="detail-card">'
  +'<input class="task-title-input" value="'+escHtml(t.name)+'" onchange="updateTask('+t.id+',\'name\',this.value)" placeholder="ชื่องาน">'
  +'<textarea class="task-desc-input" onchange="updateTask('+t.id+',\'desc\',this.value)" placeholder="รายละเอียดงาน...">'+escHtml(t.desc)+'</textarea>'
  +'<div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
  +'<span class="badge '+bc+'">'+PRIORITY[u==='done'?t.priority:u]+'</span>'
  +'<button class="delete-task-btn" onclick="deleteTask('+t.id+')"><i class="ti ti-trash"></i> ลบงาน</button></div></div>'

  +'<div class="detail-card">'
  +'<div class="detail-title"><i class="ti ti-calendar-event"></i>Deadline & เวลาที่เหลือ</div>'
  +'<div class="meta-grid">'
  +'<div><div class="meta-label">วันและเวลา deadline</div>'
  +'<input type="datetime-local" class="deadline-input" value="'+t.deadline+'" onchange="updateTask('+t.id+',\'deadline\',this.value)"></div>'
  +'<div><div class="meta-label">ลำดับความสำคัญ</div>'
  +'<select class="priority-select" onchange="updateTask('+t.id+',\'priority\',this.value)">'
  +Object.entries(PRIORITY).map(([k,v])=>'<option value="'+k+'"'+(t.priority===k?' selected':'')+'>'+v+'</option>').join('')
  +'</select></div></div>'
  +'<div class="countdown '+cd.cls+'">'+cd.text+'</div></div>'

  +'<div class="detail-card">'
  +'<div class="detail-title"><i class="ti ti-list-check"></i>รายการย่อย (Subtasks)</div>'
  +'<div class="progress-label"><span>ความคืบหน้า</span><span style="font-weight:500;color:#534AB7">'+p+'%</span></div>'
  +'<div class="progress-bar"><div class="progress-bar-fill" style="width:'+p+'%"></div></div>'
  +'<div class="subtask-list">'
  +t.subtasks.map(s=>'<div class="subtask-row'+(s.done?' done-item':'')+'">'
    +'<input type="checkbox" class="subtask-cb"'+(s.done?' checked':'')+' onchange="toggleSubtask('+t.id+','+s.id+',this.checked)">'
    +'<input class="subtask-label" value="'+escHtml(s.label)+'" onchange="updateSubtask('+t.id+','+s.id+',this.value)">'
    +'<button class="subtask-del" onclick="deleteSubtask('+t.id+','+s.id+')"><i class="ti ti-x" style="font-size:14px"></i></button></div>'
  ).join('')
  +'</div>'
  +'<div class="add-subtask-row">'
  +'<input class="add-subtask-input" id="new-sub-'+t.id+'" placeholder="เพิ่มรายการใหม่..." onkeydown="if(event.key===\'Enter\')addSubtask('+t.id+')">'
  +'<button class="add-subtask-btn" onclick="addSubtask('+t.id+')"><i class="ti ti-plus"></i></button></div></div></div>'

  // === RIGHT COLUMN (ซ่อนบนมือถือ) ===
  +'<div class="detail-right">'
  +'<div class="detail-card"><div class="detail-title"><i class="ti ti-calendar"></i>ปฏิทิน</div>'+renderCalendarWidget()+'</div>'
  +'<div class="detail-card"><div class="detail-title"><i class="ti ti-list"></i>งานทั้งหมด</div>'
  +sortedTasks().map(tt=>{
    const pp=getProgress(tt),uu=getUrgency(tt);
    return'<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.06);cursor:pointer" onclick="selectTask('+tt.id+')">'
      +'<div style="flex:1;font-size:12px;font-weight:'+(tt.id===selectedId?'500':'400')+';min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(tt.name)+'</div>'
      +'<span class="badge badge-'+(uu==='done'?'done':uu)+'">'+pp+'%</span></div>';
  }).join('')+'</div></div>'
  +'</div>';
}

function renderCalendarWidget(){
  const now=new Date(),y=calYear,m=calMonth;
  const firstDay=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const dls=tasks.map(t=>{const d=new Date(t.deadline);return(d.getFullYear()===y&&d.getMonth()===m)?d.getDate():null}).filter(Boolean);
  const thaiM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return'<div class="cal-nav"><button class="cal-nav-btn" onclick="calNav(-1)">‹</button>'
    +'<span class="cal-title">'+thaiM[m]+' '+(y+543)+'</span>'
    +'<button class="cal-nav-btn" onclick="calNav(1)">›</button></div>'
    +'<div class="calendar-grid">'
    +['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>'<div class="cal-header">'+d+'</div>').join('')
    +Array(firstDay).fill('<div></div>').join('')
    +Array.from({length:dim},(_,i)=>{
      const day=i+1,iT=(now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day),iD=dls.includes(day);
      return'<div class="cal-day'+(iT?' today':'')+(iD?' deadline-day':'')+'">'+day+'</div>';
    }).join('')+'</div>'
    +'<div style="margin-top:8px;font-size:11px;color:#888;display:flex;gap:10px">'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:10px;border-radius:3px;background:#EEEDFE;display:inline-block"></span>วันนี้</span>'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:10px;border-radius:3px;background:#FCEBEB;display:inline-block"></span>deadline</span></div>';
}

function renderCalendar(){
  const mc=document.getElementById('main-content');
  const now=new Date(),y=calYear,m=calMonth;
  const firstDay=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const thaiM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const cellH=isMobile()?'52px':'64px';
  mc.innerHTML='<div>'
    +'<div class="cal-nav" style="margin-bottom:12px"><button class="cal-nav-btn" onclick="calNav(-1)" style="font-size:24px">‹</button>'
    +'<span style="font-size:17px;font-weight:500">'+thaiM[m]+' '+(y+543)+'</span>'
    +'<button class="cal-nav-btn" onclick="calNav(1)" style="font-size:24px">›</button></div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'
    +['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>'<div style="text-align:center;font-size:11px;color:#888;padding:4px 0">'+d+'</div>').join('')
    +Array(firstDay).fill('<div></div>').join('')
    +Array.from({length:dim},(_,i)=>{
      const day=i+1,iT=(now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day);
      const dayTasks=tasks.filter(t=>{const d=new Date(t.deadline);return d.getFullYear()===y&&d.getMonth()===m&&d.getDate()===day});
      return'<div style="min-height:'+cellH+';border:1px solid rgba(0,0,0,0.09);border-radius:6px;padding:3px;background:'+(iT?'#EEEDFE':'#fff')+'">'
        +'<div style="font-size:11px;font-weight:'+(iT?'500':'400')+';color:'+(iT?'#534AB7':'#1a1a18')+'">'+day+'</div>'
        +dayTasks.map(t=>'<div style="font-size:9px;background:#FCEBEB;color:#A32D2D;border-radius:3px;padding:1px 3px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="selectTask('+t.id+');setView(\'detail\',document.querySelector(\'.view-tab\'))">'+escHtml(t.name)+'</div>').join('')
        +'</div>';
    }).join('')+'</div>'
    +'<div style="margin-top:10px;font-size:12px;color:#888">กดที่ชื่องานเพื่อดูรายละเอียด</div></div>';
}

function renderOverview(){
  const mc=document.getElementById('main-content');
  const total=tasks.length,done=tasks.filter(t=>getProgress(t)===100).length;
  const critical=tasks.filter(t=>getUrgency(t)==='critical').length;
  const avgP=total?Math.round(tasks.reduce((a,t)=>a+getProgress(t),0)/total):0;
  let html='<div class="stats-row">'
    +'<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-lbl">ทั้งหมด</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:#1D9E75">'+done+'</div><div class="stat-lbl">เสร็จแล้ว</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:#E24B4A">'+critical+'</div><div class="stat-lbl">วิกฤต</div></div></div>'
    +'<div style="background:#f5f4f0;border-radius:12px;padding:14px;border:1px solid rgba(0,0,0,0.08);margin-bottom:14px">'
    +'<div style="font-size:13px;margin-bottom:6px;font-weight:500">ความคืบหน้าโดยรวม</div>'
    +'<div class="progress-label"><span style="font-size:12px;color:#888">ค่าเฉลี่ยทุกงาน</span><span style="font-weight:500;color:#534AB7">'+avgP+'%</span></div>'
    +'<div class="progress-bar" style="height:10px"><div class="progress-bar-fill" style="width:'+avgP+'%"></div></div></div>';
  if(!tasks.length){html+='<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">ยังไม่มีงาน</div>';}
  html+=sortedTasks().map(t=>{
    const p=getProgress(t),u=getUrgency(t);
    const cd=u==='done'?{text:'เสร็จแล้ว'}:getCountdown(t.deadline);
    return'<div style="background:#f5f4f0;border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer" onclick="selectTask('+t.id+');setView(\'detail\',document.querySelector(\'.view-tab\'))">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0">'
      +'<div style="flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(t.name)+'</div>'
      +'<span class="badge badge-'+(u==='done'?'done':u)+'" style="flex-shrink:0">'+cd.text+'</span></div>'
      +'<div class="progress-label"><span style="font-size:11px;color:#888">'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+' subtasks</span>'
      +'<span style="font-size:12px;font-weight:500;color:#534AB7">'+p+'%</span></div>'
      +'<div class="progress-bar"><div class="progress-bar-fill" style="width:'+p+'%"></div></div></div>';
  }).join('');
  mc.innerHTML=html;
}

/* ---- controls ---- */
function render(){renderSidebar();renderContent()}
function selectTask(id){
  selectedId=id;
  if(isMobile()){closeSidebar();setView('detail',document.querySelector('.view-tab'));}
  render();
}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filter-tab').forEach(e=>e.classList.remove('active'));el.classList.add('active');render()}
function setView(v,el){currentView=v;document.querySelectorAll('.view-tab').forEach(e=>e.classList.remove('active'));el.classList.add('active');render()}
function calNav(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}render()}

function addTask(){
  const now=new Date();now.setDate(now.getDate()+7);
  const dl=now.toISOString().slice(0,16);
  const t={id:nextId++,name:'งานใหม่',desc:'',deadline:dl,priority:'medium',subtasks:[]};
  tasks.push(t);selectedId=t.id;
  if(isMobile())closeSidebar();
  setView('detail',document.querySelector('.view-tab'));
  render();
  setTimeout(()=>{const inp=document.querySelector('.task-title-input');if(inp){inp.focus();inp.select();}},60);
}
function deleteTask(id){
  id=+id;
  if(!confirm('ลบงานนี้?'))return;
  const sorted=sortedTasks();
  const idx=sorted.findIndex(t=>t.id===id);
  tasks=tasks.filter(t=>t.id!==id);
  if(tasks.length){
    const ns=tasks.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
    selectedId=ns[Math.min(idx,ns.length-1)].id;
  }else{selectedId=null;}
  render();
}
function updateTask(id,key,val){id=+id;const t=tasks.find(x=>x.id===id);if(t){t[key]=val;render();}}
function addSubtask(tid){
  tid=+tid;
  const inp=document.getElementById('new-sub-'+tid);
  if(!inp||!inp.value.trim())return;
  const t=tasks.find(x=>x.id===tid);if(!t)return;
  t.subtasks.push({id:nextSubId++,label:inp.value.trim(),done:false});
  inp.value='';render();
}
function toggleSubtask(tid,sid,val){
  tid=+tid;sid=+sid;
  const t=tasks.find(x=>x.id===tid);const s=t&&t.subtasks.find(x=>x.id===sid);
  if(s){s.done=val;render();}
}
function updateSubtask(tid,sid,val){
  tid=+tid;sid=+sid;
  const t=tasks.find(x=>x.id===tid);const s=t&&t.subtasks.find(x=>x.id===sid);
  if(s)s.label=val;
}
function deleteSubtask(tid,sid){
  tid=+tid;sid=+sid;
  const t=tasks.find(x=>x.id===tid);if(t){t.subtasks=t.subtasks.filter(s=>s.id!==sid);render();}
}

updateFileStatus();
recalcNextIds();
render();
</script>
</body>
</html>
